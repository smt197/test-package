services:
  app:
    container_name: ${APP_NAME:-laravel-boost-mcp}
    image: ghcr.io/smt197/test-package:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8080"
    networks:
      - mcp-network
      - app-network
    environment:
      APP_NAME: '${APP_NAME:-laravel-boost-mcp}'
      APP_ENV: '${APP_ENV:-local}'
      APP_DEBUG: '${APP_DEBUG:-true}'
      APP_KEY: '${APP_KEY}'
      APP_URL: '${APP_URL}'
      PHP_OPCACHE_ENABLE: '${PHP_OPCACHE_ENABLE:-1}'
      LOG_CHANNEL: '${LOG_CHANNEL:-stack}'
      LOG_LEVEL: '${LOG_LEVEL:-error}'
      CRAWL4AI_BASE_URL: '${CRAWL4AI_BASE_URL:-http://crawl4ai.192.168.1.14.sslip.io:11235 }'
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  mcp-network:
    external: true
  app-network:
    driver: bridge